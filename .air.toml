root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# Change this to build from the na/ directory
cmd = "go build -o ./tmp/na ./cmd/na"
bin = "tmp/na"
full_bin = "./tmp/na"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
include_dir = ["na", "internal", "pkg", "config", "senders", "worker", "templates", "migrations"]
exclude_file = []
log = "air.log"

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true